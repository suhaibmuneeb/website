<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landscaping Website - Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-green-600">GreenScapes</a>
            <div class="hidden md:flex space-x-6">
                <a href="index.html" class="text-gray-700 hover:text-green-500 transition duration-300">Home</a>
                <a href="services.html" class="text-gray-700 hover:text-green-500 transition duration-300">Services</a>
                <a href="projects.html" class="text-gray-700 hover:text-green-500 transition duration-300">Projects</a>
                <a href="about.html" class="text-gray-700 hover:text-green-500 transition duration-300">About Us</a>
                <a href="contact.html" class="text-gray-700 hover:text-green-500 transition duration-300">Contact Us</a>
            </div>
            <div class="md:hidden">
                <button id="mobile-menu-button" class="text-gray-700 hover:text-green-500 focus:outline-none focus:shadow-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                    </svg>
                </button>
                <div id="mobile-menu" class="hidden absolute top-16 right-0 bg-white shadow-lg rounded-md py-2 px-4 space-y-3">
                    <a href="index.html" class="block text-gray-700 hover:text-green-500 transition duration-300">Home</a>
                    <a href="services.html" class="block text-gray-700 hover:text-green-500 transition duration-300">Services</a>
                    <a href="projects.html" class="block text-gray-700 hover:text-green-500 transition duration-300">Projects</a>
                    <a href="about.html" class="block text-gray-700 hover:text-green-500 transition duration-300">About Us</a>
                    <a href="contact.html" class="block text-gray-700 hover:text-green-500 transition duration-300">Contact Us</a>
                </div>
            </div>
        </div>
    </nav>

    <section id="contact" class="py-16 bg-gray-100">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-semibold text-center text-green-600 mb-12">Contact Us</h2>
            <div class="bg-white rounded-lg shadow-md p-8 max-w-lg mx-auto">
                <form id="contact-form" class="space-y-6">
                    <div>
                        <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name:</label>
                        <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required />
                    </div>
                    <div>
                        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                        <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required />
                    </div>
                    <div>
                        <label for="message" class="block text-gray-700 text-sm font-bold mb-2">Message:</label>
                        <textarea id="message" name="message" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline h-32 resize-y" required></textarea>
                    </div>
                    <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out w-full">Send Message</button>
                </form>
                <div id="message-sent" class="hidden text-green-600 text-center mt-4">
                    Your message has been sent!
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2024 GreenScapes Landscaping. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle functionality
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }

        // Contact form submission handling
        const contactForm = document.getElementById('contact-form');
        const messageSent = document.getElementById('message-sent');

        if (contactForm && messageSent) {
            contactForm.addEventListener('submit', (event) => {
                event.preventDefault();
                setTimeout(() => {
                    messageSent.classList.remove('hidden');
                    contactForm.reset();
                    setTimeout(() => {
                        messageSent.classList.add('hidden');
                    }, 3000);
                }, 1000);
            });
        }
    </script>
</body>
</html>
